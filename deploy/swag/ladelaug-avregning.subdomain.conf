# Sample SWAG (linuxserver.io nginx reverse-proxy) config for exposing
# ladelaug-avregning at a subdomain, e.g. ladelaug.example.com.
#
# Copy this file into your SWAG container's nginx/proxy-confs/ directory as
# ladelaug-avregning.subdomain.conf and add a DNS record / SWAG subdomain
# entry for "ladelaug" per SWAG's usual convention.
#
# This app HAS its own authentication (server-side sessions, argon2id, RBAC),
# so it is safe to expose over the internet behind TLS. The session cookie is
# issued with `Secure` + `SameSite=Lax`; it only works over HTTPS, which is
# why `X-Forwarded-Proto: https` (set by SWAG's proxy.conf) matters — the app
# runs uvicorn with `proxy_headers=True` / `forwarded_allow_ips="*"` and
# trusts that header to know the original scheme.
#
# The resolver/variable upstream pattern below lets SWAG start even if this
# container isn't up yet (nginx resolves the name lazily, per request, via
# Docker's embedded DNS instead of once at config-load time).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ladelaug.*;

    include /config/nginx/ssl.conf;

    # Headroom for future report/PDF downloads; the API itself sends small JSON.
    client_max_body_size 10M;

    location / {
        include /config/nginx/proxy.conf;
        resolver 127.0.0.11 valid=30s;
        set $upstream_app ladelaug-avregning;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
