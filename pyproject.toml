[project]
name = "ladelaug-avregning"
version = "0.5.0"
description = "EV charging co-op prepaid-balance and monthly-settlement portal."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "anyio>=4.0",
    "httpx>=0.27",
    "tenacity>=8.4",
    "croniter>=2.0",
    "workalendar>=17.0",
    "tzdata>=2024.1",
    "weasyprint>=60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ladelaug_avregning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 flags function calls in argument defaults, but FastAPI's dependency
# injection (Depends()/Form()/File() as a parameter default) is the framework's
# own documented idiom, not a bug. Ignored project-wide rather than sprinkling
# `# noqa` on every route handler.
ignore = ["B008"]
