# Copy this file to config/config.yaml and edit. config.yaml is gitignored.

server:
  host: "0.0.0.0"
  port: 8080
  # Directory of the built frontend. Served at / by the app when it exists.
  static_dir: "frontend/dist"

database:
  path: "state/ladelaug.db"

timezone: "Europe/Oslo"

logging:
  level: "INFO" # DEBUG | INFO | WARNING | ERROR | CRITICAL

auth:
  # HMAC / integrity secret. Leave empty here and provide it via the
  # LADELAUG_SECRET_KEY environment variable (or a .env file). The app refuses
  # to start if neither is set.
  secret_key: ""
  session_ttl_hours: 720 # 30 days, sliding
  cookie_secure: true # set false only for plain-HTTP localhost development
  cookie_name: "ladelaug_session"
  login_max_attempts: 5
  login_window_seconds: 900 # 15 minutes
  argon2_time_cost: 3
  argon2_memory_cost_kib: 65536 # 64 MiB
  argon2_parallelism: 2

bootstrap_admin:
  # Optional. If both are set and the users table is empty, an admin account is
  # created on startup. Otherwise use: python -m ladelaug_avregning create-admin
  email: ""
  password: ""

zaptec:
  # Zaptec Public API (https://api.zaptec.com). While disabled the sync
  # endpoints return 503. Leave the password blank here and pass it via the
  # ZAPTEC_PASSWORD environment variable (or .env).
  enabled: false
  base_url: "https://api.zaptec.com"
  token_url: "https://api.zaptec.com/oauth/token"
  username: ""
  password: ""
  installation_id: "" # optional; if blank, all visible installations are synced
  request_timeout_seconds: 30
  page_size: 500
  max_retries: 3
  # Shown to a member whose charging access is warned/disabled (US-305). 1D
  # records the status and emails the member; it does not call Zaptec to
  # enforce it — an admin acts here.
  portal_url: "https://portal.zaptec.com"
  # Debug: leave "" for off. A path makes the client dump one JSON file per
  # Zaptec HTTP call (token + password redacted). Or set ZAPTEC_CAPTURE_DIR.
  capture_dir: ""

email:
  # backend: console (log only) | file (.eml under state/mail/) | smtp | gmail
  backend: "console"
  from_address: "ladelaug@example.com"
  base_url: "http://localhost:8080" # public origin, for links in emails
  smtp_host: "localhost"
  smtp_port: 25
  smtp_username: ""
  smtp_password: ""
  smtp_starttls: true
  # backend: gmail — Gmail REST API with an OAuth2 refresh token. Leave the
  # secrets blank here and set GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET /
  # GMAIL_REFRESH_TOKEN (or .env); mint the token with
  # scripts/gmail_oauth_bootstrap.py. gmail_sender defaults to from_address and
  # must be the authenticated account or a verified "Send mail as" alias.
  gmail_client_id: ""
  gmail_client_secret: ""
  gmail_refresh_token: ""
  gmail_sender: ""
  magic_link_ttl_minutes: 30
  password_reset_ttl_minutes: 60
